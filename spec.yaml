id: gcf_event_upload
requirements:
  - name: ecoscope-platform
    version: ">=2.23.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/
  # ecoscope-platform requires pydeck==0.9.2, which is only on conda-forge;
  # pinned here so strict channel priority can resolve it.
  - name: pydeck
    version: 0.9.2
    channel: conda-forge
  - name: ecoscope-workflows-ext-gcf
    version: "0.3.0"
    channel: https://repo.prefix.dev/ecoscope-workflows-gcf/

rjsf-overrides:
  properties:
    event_upload.properties.event_type.title: "Event type"
    event_upload.properties.action.title: "Action"
    event_upload.properties.csv_path.title: "CSV file (full path)"
    event_upload.properties.time_zone.title: "Time zone of the times in your CSV"

task-instance-defaults:
  skipif:
    conditions:
      - any_dependency_skipped

workflow:

  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client_name
    task: set_er_connection

  - name: Event Upload
    id: event_upload
    task: gcf_event_upload
    partial:
      client: ${{ workflow.er_client_name.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

  - name: Summary
    id: summary_widget
    task: create_text_widget_single_view
    partial:
      title: "Event Upload"
      data: ${{ workflow.event_upload.return }}

  - name: Create Dashboard
    id: upload_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.summary_widget.return }}
