[workspace]
name = "gcf-event-upload"
channels = ['https://repo.prefix.dev/ecoscope-workflows/', 'https://repo.prefix.dev/ecoscope-workflows-custom/', 'conda-forge']
platforms = ['linux-64', 'osx-arm64', 'win-64']

[tool.wt]
published = false

[dependencies]
wt-compiler = ">=0.8.2,<0.9.0"
graphviz = "*"
go-yq = "*"
python = "3.12.*"
# wt-compiler runs `python -m ruff`; conda-forge ruff >=0.17 (Oct 2026) ships only the binary
ruff = "<0.17"
