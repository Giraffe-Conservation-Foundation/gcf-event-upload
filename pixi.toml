[workspace]
name = "gcf-event-upload"
channels = ['https://repo.prefix.dev/ecoscope-workflows/', 'https://repo.prefix.dev/ecoscope-workflows-custom/', 'conda-forge']
platforms = ['linux-64', 'osx-arm64', 'win-64']

[tool.wt]
published = false

[dependencies]
# 0.8.2 exactly: 0.8.3 calls `python -m ruff` but the conda ruff it pulls has no Python module
wt-compiler = "0.8.2.*"
graphviz = "*"
go-yq = "*"
python = "3.12.*"
